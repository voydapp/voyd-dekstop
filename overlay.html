<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #overlay-root {
    max-height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
  }
  #camera-tiles {
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  #camera-tiles.visible { display: flex; }
  .cam-tile {
    position: relative;
    width: 76px;
    height: 57px;
    border-radius: 6px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
    flex-shrink: 0;
  }
  .cam-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .cam-label {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 2px 4px;
    font-size: 9px;
    line-height: 1.2;
    color: #f0f0f0;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #panel {
    display: none;
    background: rgba(20, 20, 24, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 10px 12px;
    color: #e6e6e6;
    font-size: 13px;
    box-sizing: border-box;
    width: 100%;
  }
  #panel.visible { display: block; }
  #channel-name {
    font-weight: 600;
    font-size: 11px;
    color: #9a9aa5;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .participant {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4a4a52;
    flex-shrink: 0;
  }
  .dot.speaking { background: #3ba55c; }
  .name {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #e05252;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div id="overlay-root">
    <div id="camera-tiles"></div>
    <div id="panel"></div>
  </div>
  <script src="overlay-renderer.js"></script>
</body>
</html>
